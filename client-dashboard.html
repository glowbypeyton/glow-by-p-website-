<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Skin Journey — Glow by P</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<style>
  .dash-section{ background:var(--sage-tint); border:1px solid var(--line-soft); border-radius:22px; padding:32px; margin-bottom:24px; }
  .coming-soon{ opacity:0.6; padding:24px 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner" style="justify-content:space-between;">
    <a href="index.html" class="logo-link"><img src="images/glow-by-p-logo.png" alt="Glow by P" class="logo-img"></a>
    <button id="logoutBtn" class="btn btn-line btn-sm">Log Out</button>
  </div>
</header>

<main>
  <section class="section" style="padding-top: clamp(48px,7vw,90px);">
    <div class="wrap" style="max-width:760px;">
      <span class="eyebrow">Client Portal</span>
      <h1 class="h-xl mt-16" id="welcomeHeading">Welcome back</h1>
      <p class="lede mt-16">Your routine, progress photos, and order history, all in one place.</p>

      <div class="mt-40">
        <div class="dash-section">
          <h2 class="h-md">Your Routine</h2>
          <div id="routineContent" class="mt-16" style="opacity:0.6;">Loading…</div>
        </div>

        <div class="dash-section">
          <h2 class="h-md">Progress &amp; Notes</h2>
          <div id="notesContent" class="mt-16" style="opacity:0.6;">Loading…</div>
        </div>

        <div class="dash-section">
          <h2 class="h-md">Order History</h2>
          <p class="coming-soon">Skincare orders you place through the site will show up here.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return iso; }
}

fetch('/.netlify/functions/client-me')
  .then(function (res) {
    if (res.status === 401) {
      window.location.href = 'client-portal.html';
      return null;
    }
    return res.json();
  })
  .then(function (data) {
    if (!data) return;
    var firstName = (data.client.full_name || '').split(' ')[0];
    document.getElementById('welcomeHeading').textContent = 'Welcome back' + (firstName ? ', ' + firstName : '');
  })
  .catch(function () {
    window.location.href = 'client-portal.html';
  });

fetch('/.netlify/functions/client-my-journey')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    var routineEl = document.getElementById('routineContent');
    if (!data.amRoutine && !data.pmRoutine) {
      routineEl.innerHTML = '<p style="opacity:0.7;">Your AM and PM routine will show up here once Peyton sets it up for you after your first visit.</p>';
    } else {
      routineEl.innerHTML =
        (data.amRoutine ? '<p><strong>AM:</strong> ' + escapeHtml(data.amRoutine).replace(/\n/g, '<br>') + '</p>' : '') +
        (data.pmRoutine ? '<p class="mt-16"><strong>PM:</strong> ' + escapeHtml(data.pmRoutine).replace(/\n/g, '<br>') + '</p>' : '');
    }

    var notesEl = document.getElementById('notesContent');
    if (!data.notes || !data.notes.length) {
      notesEl.innerHTML = '<p style="opacity:0.7;">Notes and progress photos from your treatments will appear here over time.</p>';
    } else {
      notesEl.innerHTML = data.notes.map(function (n) {
        return '' +
          '<div style="border-bottom:1px solid var(--line-soft); padding:14px 0;">' +
            '<div style="font-size:0.72rem; opacity:0.55; margin-bottom:6px;">' + formatDate(n.created_at) + '</div>' +
            (n.note ? '<p>' + escapeHtml(n.note) + '</p>' : '') +
            (n.photo_url ? '<img src="' + escapeHtml(n.photo_url) + '" alt="Progress photo" style="max-width:220px; border-radius:12px; margin-top:10px; display:block;">' : '') +
          '</div>';
      }).join('');
    }
  })
  .catch(function () {
    document.getElementById('routineContent').textContent = 'Could not load your routine.';
    document.getElementById('notesContent').textContent = 'Could not load your history.';
  });

  fetch('/.netlify/functions/client-logout', { method: 'POST' }).then(function () {
