<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Admin — Glow by P</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<style>
  .cat-group{ margin-bottom:36px; }
  .cat-group-title{ font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:600; opacity:0.6; margin-bottom:14px; }
  .prod-row{ background:var(--sage-tint); border:1px solid var(--line-soft); border-radius:16px; padding:14px 18px; margin-bottom:10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .prod-thumb{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--line-soft); }
  .prod-thumb-empty{ width:56px; height:56px; border-radius:10px; flex-shrink:0; background:var(--line-soft); display:flex; align-items:center; justify-content:center; font-size:0.6rem; opacity:0.5; text-align:center; }
  .prod-info{ flex:1; min-width:180px; }
  .prod-name{ font-family:var(--serif); font-size:1rem; color:var(--espresso); }
  .prod-meta{ font-size:0.78rem; opacity:0.6; margin-top:2px; }
  .prod-stock{ display:flex; align-items:center; gap:8px; }
  .prod-stock label{ font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.6; }
  .prod-stock input{ width:64px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem; }
  .prod-actions{ display:flex; gap:8px; }
  .stock-flash{ transition: background-color .6s ease; }
  .stock-flash.saved{ background-color: rgba(102,107,78,0.18); }
  dialog#productDialog{ border:none; border-radius:22px; padding:0; width:min(560px, 92vw); background:var(--cream); }
  dialog#productDialog::backdrop{ background:rgba(53,45,35,0.45); }
  .dialog-inner{ padding:32px; max-height:85vh; overflow-y:auto; }
  .dialog-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px){ .dialog-row-2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner" style="justify-content:space-between;">
    <a href="index.html" class="logo-link"><img src="images/glow-by-p-logo.png" alt="Glow by P" class="logo-img"></a>
    <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
      <a href="admin-dashboard.html" class="btn btn-line btn-sm">Inbox</a>
      <a href="admin-clients.html" class="btn btn-line btn-sm">Clients</a>
      <button id="logoutBtn" class="btn btn-line btn-sm">Log Out</button>
    </div>
  </div>
</header>

<main>
  <section class="section bg-cream" style="padding-top: clamp(48px,7vw,90px); padding-bottom:20px;">
    <div class="wrap" style="max-width:900px;">
      <span class="eyebrow">Admin</span>
      <h1 class="h-xl mt-16">Products</h1>
      <p class="lede mt-16">Manage everything in the shop — including gifts. Edit stock right here, or open a product to change its name, price, description, photo, or category.</p>
      <button class="btn btn-solid mt-24" id="addProductBtn">+ Add Product</button>
    </div>
  </section>

  <section class="section bg-olive-mist" style="padding-top:20px;">
    <div class="wrap" style="max-width:900px;">
      <div id="loadingState" style="opacity:0.6;">Loading…</div>
      <div id="productGroups"></div>
    </div>
  </section>
</main>

<dialog id="productDialog">
  <div class="dialog-inner">
    <h2 class="h-md" id="dialogTitle">Add Product</h2>
    <form id="productForm" novalidate>
      <input type="hidden" id="originalSlug">
      <input type="hidden" id="pSlug">
      <div class="field mt-24">
        <label for="pName">Name</label>
        <input id="pName" required>
      </div>
      <div class="dialog-row-2">
        <div class="field">
          <label for="pCategory">Category</label>
          <input id="pCategory" list="categoryOptions" required placeholder="e.g. cleansers">
          <datalist id="categoryOptions"></datalist>
        </div>
        <div class="field">
          <label for="pDisplayOrder">Order in category</label>
          <input id="pDisplayOrder" type="number" min="0" value="0">
        </div>
      </div>
      <div class="field">
        <label for="pDescription">Description</label>
        <textarea id="pDescription" rows="3"></textarea>
      </div>
      <div class="dialog-row-2">
        <div class="field">
          <label for="pPrice">Price ($)</label>
          <input id="pPrice" type="number" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label for="pPriceLabel">Price label (optional)</label>
          <input id="pPriceLabel" placeholder="e.g. $25 – $200">
        </div>
      </div>
      <div class="field">
        <label for="pImageUrl">Photo path or URL</label>
        <input id="pImageUrl" placeholder="images/products/example.jpg">
      </div>
      <div class="field">
        <label for="pStock">Stock</label>
        <input id="pStock" type="number" min="0" required>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:10px;">
        <input id="pFeatured" type="checkbox" style="width:auto;">
        <label for="pFeatured" style="margin:0; text-transform:none; letter-spacing:normal; font-size:0.9rem; opacity:1;">Featured on homepage (Shop Your Skincare preview)</label>
      </div>
      <p id="dialogMsg" style="font-size:0.85rem; color:#A24B3F; margin-bottom:14px; display:none;"></p>
      <div class="btn-row" style="justify-content:space-between; align-items:center;">
        <button type="button" id="deleteProductBtn" class="btn btn-line" style="display:none; border-color:#A24B3F; color:#A24B3F;">Delete Product</button>
        <div style="display:flex; gap:10px; margin-left:auto;">
          <button type="button" class="btn btn-line" id="cancelDialogBtn">Cancel</button>
          <button type="submit" class="btn btn-solid" id="saveProductBtn">Save</button>
        </div>
      </div>
    </form>
  </div>
</dialog>

<script>
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Known categories in the order they should display, with friendly labels.
// Any category not listed here (e.g. a brand-new one you type into the
// Add Product form) still works fine — it's shown title-cased, grouped
// after the known ones.
var CATEGORY_LABELS = {
  'cleansers': 'Cleansers',
  'toners': 'Toners + Mists',
  'serums': 'Serums',
  'moisturizers': 'Moisturizers',
  'spf': 'SPF',
  'exfoliants': 'Exfoliants',
  'masks': 'Masks + Treatments',
  'eye-care': 'Eye Care',
  'body-care': 'Body Care',
  'gifts': 'Gifts'
};
var CATEGORY_ORDER = Object.keys(CATEGORY_LABELS);

function categoryLabel(cat) {
  if (CATEGORY_LABELS[cat]) return CATEGORY_LABELS[cat];
  return String(cat).replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

var allProducts = [];
var dialog = document.getElementById('productDialog');

document.getElementById('categoryOptions').innerHTML = CATEGORY_ORDER.map(function (c) {
  return '<option value="' + escapeHtml(c) + '">' + escapeHtml(categoryLabel(c)) + '</option>';
}).join('');

function loadProducts() {
  fetch('/.netlify/functions/get-products')
    .then(function (res) {
      if (res.status === 401) { window.location.href = 'admin-login.html'; return null; }
      return res.json();
    })
    .then(function (data) {
      if (!data) return;
      allProducts = data.products || [];
      document.getElementById('loadingState').style.display = 'none';
      renderGroups();
    })
    .catch(function () {
      document.getElementById('loadingState').textContent = 'Could not load products. Please refresh.';
    });
}

function renderGroups() {
  var byCategory = {};
  allProducts.forEach(function (p) {
    if (!byCategory[p.category]) byCategory[p.category] = [];
    byCategory[p.category].push(p);
  });

  var categories = Object.keys(byCategory);
  categories.sort(function (a, b) {
    var ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  var container = document.getElementById('productGroups');
  if (!categories.length) {
    container.innerHTML = '<p style="opacity:0.6;">No products yet. Click "Add Product" to create your first one.</p>';
    return;
  }

  container.innerHTML = categories.map(function (cat) {
    var rows = byCategory[cat].map(function (p) {
      var thumb = p.image_url
        ? '<img class="prod-thumb" src="' + escapeHtml(p.image_url) + '" alt="">'
        : '<div class="prod-thumb-empty">No photo</div>';
      return '' +
        '<div class="prod-row" data-slug="' + escapeHtml(p.slug) + '">' +
          thumb +
          '<div class="prod-info">' +
            '<div class="prod-name">' + escapeHtml(p.name) + (p.featured ? ' <span style="opacity:0.55; font-size:0.72rem;">&#9733; Featured</span>' : '') + '</div>' +
            '<div class="prod-meta">' + (p.price_label ? escapeHtml(p.price_label) : '$' + Number(p.price).toFixed(2)) + '</div>' +
          '</div>' +
          '<div class="prod-stock stock-flash">' +
            '<label for="stock-' + escapeHtml(p.slug) + '">Stock</label>' +
            '<input type="number" min="0" id="stock-' + escapeHtml(p.slug) + '" value="' + Number(p.stock) + '" data-slug="' + escapeHtml(p.slug) + '">' +
          '</div>' +
          '<div class="prod-actions">' +
            '<button class="btn btn-line btn-sm edit-btn" data-slug="' + escapeHtml(p.slug) + '">Edit</button>' +
          '</div>' +
        '</div>';
    }).join('');
    return '' +
      '<div class="cat-group">' +
        '<div class="cat-group-title">' + escapeHtml(categoryLabel(cat)) + ' (' + byCategory[cat].length + ')</div>' +
        rows +
      '</div>';
  }).join('');

  container.querySelectorAll('.prod-stock input').forEach(function (input) {
    var lastSaved = input.value;
    input.addEventListener('change', function () {
      if (input.value === lastSaved) return;
      var slug = input.getAttribute('data-slug');
      var product = allProducts.find(function (p) { return p.slug === slug; });
      if (!product) return;
      var stockWrap = input.closest('.prod-stock');
      saveProduct(Object.assign({}, product, { stock: input.value }), slug, function (ok) {
        if (ok) {
          lastSaved = input.value;
          product.stock = parseInt(input.value, 10);
          stockWrap.classList.add('saved');
          setTimeout(function () { stockWrap.classList.remove('saved'); }, 700);
        } else {
          input.value = lastSaved;
        }
      });
    });
  });

  container.querySelectorAll('.edit-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var slug = btn.getAttribute('data-slug');
      var product = allProducts.find(function (p) { return p.slug === slug; });
      if (product) openDialog(product);
    });
  });
}

function openDialog(product) {
  document.getElementById('dialogMsg').style.display = 'none';
  document.getElementById('dialogTitle').textContent = product ? 'Edit Product' : 'Add Product';
  document.getElementById('originalSlug').value = product ? product.slug : '';
  document.getElementById('pSlug').value = product ? product.slug : '';
  document.getElementById('pName').value = product ? product.name : '';
  document.getElementById('pCategory').value = product ? product.category : '';
  document.getElementById('pDisplayOrder').value = product ? product.display_order : 0;
  document.getElementById('pDescription').value = product ? product.description : '';
  document.getElementById('pPrice').value = product ? product.price : '';
  document.getElementById('pPriceLabel').value = product && product.price_label ? product.price_label : '';
  document.getElementById('pImageUrl').value = product ? product.image_url : '';
  document.getElementById('pStock').value = product ? product.stock : '';
  document.getElementById('pFeatured').checked = !!(product && product.featured);
  document.getElementById('deleteProductBtn').style.display = product ? 'inline-flex' : 'none';
  dialog.showModal();
}

document.getElementById('addProductBtn').addEventListener('click', function () { openDialog(null); });
document.getElementById('cancelDialogBtn').addEventListener('click', function () { dialog.close(); });

function saveProduct(fields, originalSlug, callback) {
  fetch('/.netlify/functions/admin-save-product', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      originalSlug: originalSlug || undefined,
      slug: fields.slug,
      name: fields.name,
      category: fields.category,
      description: fields.description,
      price: fields.price,
      priceLabel: fields.price_label || fields.priceLabel || null,
      imageUrl: fields.image_url || fields.imageUrl || '',
      stock: fields.stock,
      displayOrder: fields.display_order != null ? fields.display_order : fields.displayOrder,
      featured: !!fields.featured
    })
  })
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (result) { callback(result.ok, result.data); })
    .catch(function () { callback(false, { error: 'Could not reach the server.' }); });
}

document.getElementById('productForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var saveBtn = document.getElementById('saveProductBtn');
  var msg = document.getElementById('dialogMsg');
  msg.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  var fields = {
    slug: document.getElementById('pSlug').value.trim(),
    name: document.getElementById('pName').value.trim(),
    category: document.getElementById('pCategory').value.trim().toLowerCase(),
    description: document.getElementById('pDescription').value.trim(),
    price: document.getElementById('pPrice').value,
    priceLabel: document.getElementById('pPriceLabel').value.trim() || null,
    imageUrl: document.getElementById('pImageUrl').value.trim(),
    stock: document.getElementById('pStock').value,
    displayOrder: document.getElementById('pDisplayOrder').value,
    featured: document.getElementById('pFeatured').checked
  };
  var originalSlug = document.getElementById('originalSlug').value || null;

  saveProduct(fields, originalSlug, function (ok, data) {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
    if (ok) {
      dialog.close();
      loadProducts();
    } else {
      msg.textContent = (data && data.error) || 'Something went wrong.';
      msg.style.display = 'block';
    }
  });
});

document.getElementById('deleteProductBtn').addEventListener('click', function () {
  var slug = document.getElementById('originalSlug').value;
  var name = document.getElementById('pName').value;
  if (!slug) return;
  if (!confirm('Delete "' + name + '"? This can\'t be undone.')) return;

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Deleting…';

  fetch('/.netlify/functions/admin-delete-product', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: slug })
  })
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (result) {
      btn.disabled = false;
      btn.textContent = 'Delete Product';
      if (result.ok) {
        dialog.close();
        loadProducts();
      } else {
        var msg = document.getElementById('dialogMsg');
        msg.textContent = (result.data && result.data.error) || 'Could not delete product.';
        msg.style.display = 'block';
      }
    })
    .catch(function () {
      btn.disabled = false;
      btn.textContent = 'Delete Product';
    });
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  fetch('/.netlify/functions/admin-logout', { method: 'POST' }).then(function () {
    window.location.href = 'admin-login.html';
  });
});

loadProducts();
</script>

</body>
</html>
